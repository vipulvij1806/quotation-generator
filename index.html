<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Monika Makeovers Quotation</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="wrap">
    <div class="panel" id="panel">
      <div class="sec-head">✦ Build Quotation</div>

      <div class="fld">
        <div class="lbl">Client Name</div>
        <input type="text" id="clientName" placeholder="e.g. Priya Sharma" />
      </div>

      <div class="fld">
        <div class="lbl">Phone / WhatsApp</div>
        <input type="text" id="clientPhone" placeholder="+91 98765 43210" />
      </div>

      <div class="fld">
        <div class="lbl">Special Note</div>
        <textarea id="globalNote" rows="2" placeholder="Conveyance, advance, terms..."></textarea>
      </div>

      <div>
        <div class="sec-head">Events & Dates</div>
        <div id="datesList"></div>
        <button class="add-btn" onclick="addDate()">+ Add Date</button>
      </div>

      <button class="gen-btn" onclick="generateQuote()">✦ Generate Quotation</button>
    </div>

    <div class="preview" id="previewArea">
      <div class="empty">
        <div style="font-size:28px;margin-bottom:8px">💄</div>
        Add events & click <br><em>Generate Quotation</em>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
