<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Monika Makeovers Quotation</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">

    <!-- Page 1 -->
    <div class="page" id="page1">
      <h2>Client Details</h2>
      <div class="fld">
        <label>Client Name</label>
        <input type="text" id="clientName" placeholder="e.g. Priya Sharma">
      </div>

      <div class="fld">
        <label>Phone</label>
        <input type="text" id="clientPhone" placeholder="+91 98765 43210">
      </div>

      <div class="fld">
        <label>Special Note</label>
        <textarea id="specialNote" rows="2" placeholder="Advance, conveyance, terms..."></textarea>
      </div>

      <div class="fld">
        <label>Location</label>
        <input type="text" id="location" placeholder="e.g. Jaipur">
      </div>

      <div class="fld">
        <label>Select Events</label>
        <div class="checkbox-group">
          <label><input type="checkbox" value="Mehndi"> Mehndi</label>
          <label><input type="checkbox" value="Sangeet"> Sangeet</label>
          <label><input type="checkbox" value="Wedding"> Wedding</label>
          <label><input type="checkbox" value="Reception"> Reception</label>
        </div>
      </div>

      <button class="next-btn" onclick="goToPage(2)">Next ➝</button>
    </div>

    <!-- Page 2 (placeholder for now) -->
    <div class="page hidden" id="page2">
      <h2>Package Details</h2>
      <p>Here you’ll add package inclusions, pricing, etc.</p>
      <button class="back-btn" onclick="goToPage(1)">⬅ Back</button>
      <button class="next-btn" onclick="goToPage(3)">Next ➝</button>
    </div>

    <!-- More pages can be added similarly -->

  </div>

  <script src="script.js"></script>
</body>
</html>
